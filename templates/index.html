<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LawGrammarChecker</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #1a2e1a;
      --ink-soft:  #4a6a4a;
      --green:     #2e7d32;
      --green-light:#4caf50;
      --green-pale:#f0f7f0;
      --green-deep:#e8f5e9;
      --border:    #c8ddc8;
      --accent:    #2e7d32;
      --accent-dark:#1b5e20;
      --radius:    4px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--green-pale);
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(46,125,50,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(76,175,80,0.06) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Thin vertical rule decoration left side */
    body::before {
      content: '';
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, transparent, var(--green-light), transparent);
      opacity: .5;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-top: 3px solid var(--green);
      border-radius: var(--radius);
      box-shadow:
        0 2px 4px rgba(26,46,26,.05),
        0 12px 40px rgba(26,46,26,.10);
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 500px;
      position: relative;
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Corner seal removed */

    /* Header */
    .card-header-area {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .wordmark-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.3px;
      line-height: 1;
    }

    /* Office status bar */
    #officeStatus {
      display: none;
      font-size: 11px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }
    #officeStatus.connected {
      display: block;
      background: #edf7ed;
      color: #2d6a2d;
      border-left: 3px solid #4caf50;
    }
    #officeStatus.disconnected {
      display: block;
      background: #fff8e1;
      color: #6d4c00;
      border-left: 3px solid #ffc107;
    }

    /* Page Navigator */
    #pageNav {
      display: none;
      background: var(--green-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    #pageNav .nav-title {
      font-size: 9px;
      font-weight: 500;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .page-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-page {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 6px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background .18s, transform .1s;
    }
    .btn-page:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }
    .btn-page:disabled {
      background: #c5c8d8;
      cursor: not-allowed;
      transform: none;
    }
    #pageIndicator {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      min-width: 90px;
      text-align: center;
    }
    #pageCharCount {
      font-size: 10px;
      color: var(--ink-soft);
      margin-top: 8px;
      text-align: center;
    }
    #pageDots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #d0cfc8;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .dot.active  { background: var(--accent); transform: scale(1.35); }
    .dot.checked { background: #4caf50; }
    .dot:hover   { background: var(--green-light); }

    #charWarning {
      display: none;
      font-size: 10px;
      color: #6d4c00;
      background: #fff8e1;
      border-left: 3px solid #ffc107;
      border-radius: var(--radius);
      padding: 6px 10px;
      margin-top: 8px;
    }

    /* Textarea */
    .field-label {
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--ink-soft);
      margin-bottom: 8px;
      display: block;
    }
    textarea {
      width: 100%;
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid var(--border);
      background-color: var(--green-pale);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: var(--ink);
      line-height: 1.6;
      resize: vertical;
      min-height: 160px;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(46,125,50,.10);
      background: #fff;
    }
    textarea::placeholder { color: #9ab89a; font-weight: 300; }

    /* Buttons */
    .btn-refresh {
      width: 100%;
      margin-top: 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink-soft);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: border-color .18s, color .18s, background .18s;
    }
    .btn-refresh:hover {
      border-color: var(--green);
      color: var(--green);
      background: rgba(46,125,50,.04);
    }
    .btn-refresh:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-check {
      width: 100%;
      margin-top: 10px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 12px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background .18s, transform .1s, box-shadow .18s;
      position: relative;
      overflow: hidden;
    }
    .btn-check::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
    }
    .btn-check:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(46,125,50,.3);
    }
    .btn-check:active { transform: translateY(0); }

    /* Divider */
    .form-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0 16px;
    }

    /* Footer */
    footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    footer span {
      font-size: 10px;
      font-weight: 300;
      color: #aaa8a0;
      letter-spacing: 0.3px;
    }
    .footer-dots {
      display: flex;
      gap: 4px;
    }
    .footer-dots i {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--green-light);
      opacity: .5;
      display: inline-block;
    }
  </style>
</head>

<body>
<div class="card">

  <!-- Header -->
  <div class="card-header-area">
    <div class="wordmark">
      <span class="wordmark-main">LawGrammarChecker</span>
    </div>
  </div>

  <div id="officeStatus"></div>

  <form action="/" method="post">
    <input type="hidden" name="mode" value="word">

    <!-- Page Navigator -->
    <div id="pageNav">
      <div class="nav-title">Document Pages</div>
      <div class="page-controls">
        <button type="button" class="btn-page" id="btnPrev" onclick="goToPage(currentPage - 1)" disabled>← Prev</button>
        <span id="pageIndicator">Page 1 of 1</span>
        <button type="button" class="btn-page" id="btnNext" onclick="goToPage(currentPage + 1)" disabled>Next →</button>
      </div>
      <div id="pageCharCount"></div>
      <div id="pageDots"></div>
      <div id="charWarning">This page contains a large amount of text. Results may take longer to process.</div>
    </div>

    <!-- Text Area -->
    <label class="field-label" for="textBox">Document Text</label>
    <textarea id="textBox" name="text" rows="7"
      placeholder="Use the button below to load your document from Microsoft Word..."></textarea>

    <button type="button" class="btn-refresh" id="btnRefresh" onclick="refreshText()">
      Refresh from Word
    </button>

    <hr class="form-divider">

    <button type="submit" class="btn-check">Run Grammar Check</button>
  </form>

  <footer>
    <span>Powered by LanguageTool &middot; Groq &middot; Flask</span>
    <div class="footer-dots"><i></i><i></i><i></i></div>
    <span>&copy; 2026</span>
  </footer>
</div>

<script>
  let isInsideWordTaskpane = false;
  let pages        = [];
  let currentPage  = 0;
  let checkedPages = new Set();
  const CHAR_WARN_LIMIT = 1800;

  window.addEventListener('message', function(event) {

    if (event.data && event.data.type === 'OFFICE_READY') {
      isInsideWordTaskpane = true;
      const s = document.getElementById('officeStatus');
      s.textContent = 'Connected to Microsoft Word';
      s.className = 'connected';
    }

    if (event.data && event.data.type === 'DOCUMENT_PAGES') {
      pages = event.data.pages || [];
      currentPage = 0;
      checkedPages.clear();

      document.getElementById('btnRefresh').textContent = 'Refresh from Word';
      document.getElementById('btnRefresh').disabled = false;

      if (pages.length === 0) {
        setStatus('Document appears to be empty.', 'disconnected');
        return;
      }

      document.getElementById('pageNav').style.display = 'block';
      buildDots();
      goToPage(0);
      setStatus(`${pages.length} page(s) loaded from document.`, 'connected');
    }

    if (event.data && event.data.type === 'ERROR') {
      alert('Word Error: ' + event.data.message);
      document.getElementById('btnRefresh').disabled = false;
    }
  });

  function goToPage(index) {
    if (index < 0 || index >= pages.length) return;
    currentPage = index;
    document.getElementById('textBox').value = pages[index];
    document.getElementById('pageIndicator').textContent = `Page ${index + 1} of ${pages.length}`;
    const len = pages[index].length;
    document.getElementById('pageCharCount').textContent = `${len} characters on this page`;
    document.getElementById('charWarning').style.display = len > CHAR_WARN_LIMIT ? 'block' : 'none';
    document.getElementById('btnPrev').disabled = index === 0;
    document.getElementById('btnNext').disabled = index === pages.length - 1;
    updateDots();
  }

  function buildDots() {
    const dotsEl = document.getElementById('pageDots');
    dotsEl.innerHTML = '';
    if (pages.length > 20) {
      dotsEl.innerHTML = `<span style="font-size:10px;color:#aaa;">${pages.length} pages loaded</span>`;
      return;
    }
    pages.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.title = `Page ${i + 1}`;
      dot.onclick = () => goToPage(i);
      dotsEl.appendChild(dot);
    });
  }

  function updateDots() {
    document.querySelectorAll('.dot').forEach((dot, i) => {
      dot.className = 'dot';
      if (i === currentPage)        dot.classList.add('active');
      else if (checkedPages.has(i)) dot.classList.add('checked');
    });
  }

  document.querySelector('form').addEventListener('submit', function() {
    checkedPages.add(currentPage);
    updateDots();
  });

  function refreshText() {
    if (!isInsideWordTaskpane) {
      alert('Not running inside a Word taskpane.\nOpen this via the Word Add-in sidebar.');
      return;
    }
    document.getElementById('btnRefresh').textContent = 'Loading...';
    document.getElementById('btnRefresh').disabled = true;
    pages = [];
    checkedPages.clear();
    document.getElementById('pageNav').style.display = 'none';
    window.parent.postMessage({ type: 'READ_DOCUMENT' }, '*');
  }

  function setStatus(msg, cls) {
    const s = document.getElementById('officeStatus');
    s.textContent = msg;
    s.className = cls;
  }
</script>
</body>
</html>
